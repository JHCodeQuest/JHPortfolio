<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joseph Hassan | Full-Stack Developer & Automation Specialist</title>
    <meta name="description" content="Full-Stack Developer & Automation Specialist crafting intuitive digital experiences and automating workflows.">
    
    <!-- Fonts - Unique combination: Syne for display, DM Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* ========== CSS RESET ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* ========== DESIGN SYSTEM ========== */
        :root {
            /* Color Palette - Deep space with electric cyan accents */
            --color-bg-deep: #050508;
            --color-bg-primary: #0a0a0f;
            --color-bg-elevated: #111118;
            --color-bg-card: #16161f;
            --color-bg-glass: rgba(22, 22, 31, 0.7);
            
            /* Accent Colors - Electric cyan with warm complement */
            --color-accent: #00f0ff;
            --color-accent-glow: rgba(0, 240, 255, 0.4);
            --color-accent-subtle: rgba(0, 240, 255, 0.1);
            --color-secondary: #ff6b35;
            --color-tertiary: #a855f7;
            
            /* Text Colors */
            --color-text-primary: #f8fafc;
            --color-text-secondary: #94a3b8;
            --color-text-muted: #64748b;
            
            /* Borders & Lines */
            --color-border: rgba(148, 163, 184, 0.1);
            --color-border-accent: rgba(0, 240, 255, 0.3);
            
            /* Typography */
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            /* Spacing */
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 2rem;
            --space-lg: 4rem;
            --space-xl: 6rem;
            --space-2xl: 10rem;
            
            /* Effects */
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-medium: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            
            --glow-sm: 0 0 20px var(--color-accent-glow);
            --glow-md: 0 0 40px var(--color-accent-glow);
            --glow-lg: 0 0 80px var(--color-accent-glow);
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-deep);
            color: var(--color-text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        body.menu-open {
            overflow: hidden;
        }
        
        /* ========== ANIMATED BACKGROUND ========== */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0, 240, 255, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.1), transparent);
            pointer-events: none;
            z-index: 0;
        }
        
        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 240, 255, 0.08);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(168, 85, 247, 0.06);
            top: 60%;
            right: 10%;
            animation-delay: -7s;
        }
        
        .orb-3 {
            width: 250px;
            height: 250px;
            background: rgba(255, 107, 53, 0.05);
            bottom: 20%;
            left: 30%;
            animation-delay: -14s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(20px, 30px) scale(1.02); }
        }
        
        /* ========== NAVIGATION ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: var(--space-sm) var(--space-md);
            background: rgba(5, 5, 8, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border);
        }
        
        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar-logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-accent);
            text-decoration: none;
            letter-spacing: -0.02em;
            text-shadow: var(--glow-sm);
            transition: var(--transition-fast);
        }
        
        .navbar-logo:hover {
            text-shadow: var(--glow-md);
        }
        
        .navbar-links {
            display: flex;
            gap: var(--space-md);
            list-style: none;
        }
        
        .navbar-links a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: var(--transition-fast);
            position: relative;
        }
        
        .navbar-links a:hover {
            color: var(--color-accent);
            background: var(--color-accent-subtle);
        }
        
        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            z-index: 1002;
        }
        
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
        }
        
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: var(--color-text-primary);
            border-radius: 2px;
            transition: var(--transition-fast);
        }
        
        .hamburger.open span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
            background-color: var(--color-accent);
        }
        
        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger.open span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
            background-color: var(--color-accent);
        }
        
        .mobile-menu-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-medium);
        }
        
        .mobile-menu-backdrop.open {
            opacity: 1;
            visibility: visible;
        }
        
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 320px;
            height: 100vh;
            background: var(--color-bg-elevated);
            z-index: 1001;
            padding: 100px var(--space-md) var(--space-md);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid var(--color-border-accent);
        }
        
        .mobile-menu-overlay.open {
            transform: translateX(0);
        }
        
        .mobile-nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }
        
        .mobile-nav-links li {
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .mobile-menu-overlay.open .mobile-nav-links li {
            opacity: 1;
            transform: translateX(0);
        }
        
        .mobile-menu-overlay.open .mobile-nav-links li:nth-child(1) { transition-delay: 0.1s; }
        .mobile-menu-overlay.open .mobile-nav-links li:nth-child(2) { transition-delay: 0.15s; }
        .mobile-menu-overlay.open .mobile-nav-links li:nth-child(3) { transition-delay: 0.2s; }
        .mobile-menu-overlay.open .mobile-nav-links li:nth-child(4) { transition-delay: 0.25s; }
        .mobile-menu-overlay.open .mobile-nav-links li:nth-child(5) { transition-delay: 0.3s; }
        .mobile-menu-overlay.open .mobile-nav-links li:nth-child(6) { transition-delay: 0.35s; }
        
        .mobile-nav-links a {
            display: block;
            padding: var(--space-sm);
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 10px;
            transition: var(--transition-fast);
        }
        
        .mobile-nav-links a:hover {
            color: var(--color-accent);
            background: var(--color-accent-subtle);
        }
        
        /* ========== HERO SECTION ========== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            padding: var(--space-2xl) var(--space-md);
            z-index: 1;
        }
        
        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-xl);
            align-items: center;
        }
        
        .hero-text {
            position: relative;
        }
        
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--color-accent-subtle);
            border: 1px solid var(--color-border-accent);
            border-radius: 50px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--color-accent);
            margin-bottom: var(--space-md);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }
        
        .hero-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--color-accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: var(--space-md);
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.1s forwards;
        }
        
        .hero-title .line {
            display: block;
        }
        
        .hero-title .highlight {
            color: var(--color-accent);
            position: relative;
        }
        
        .hero-title .highlight::after {
            content: '';
            position: absolute;
            bottom: 0.1em;
            left: 0;
            right: 0;
            height: 0.15em;
            background: var(--color-accent);
            opacity: 0.3;
            transform: skewX(-12deg);
        }
        
        .hero-description {
            font-size: 1.15rem;
            color: var(--color-text-secondary);
            max-width: 500px;
            margin-bottom: var(--space-lg);
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }
        
        .hero-cta {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.3s forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Hero Visual - Terminal Card */
        .hero-visual {
            position: relative;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }
        
        .terminal-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 0 0 1px var(--color-border-accent),
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                var(--glow-sm);
        }
        
        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--color-bg-elevated);
            border-bottom: 1px solid var(--color-border);
        }
        
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .terminal-dot.red { background: #ff5f57; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #28ca41; }
        
        .terminal-title {
            flex: 1;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }
        
        .terminal-body {
            padding: var(--space-md);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.8;
        }
        
        .terminal-line {
            margin-bottom: 0.5rem;
        }
        
        .terminal-prompt {
            color: var(--color-accent);
        }
        
        .terminal-command {
            color: var(--color-text-primary);
        }
        
        .terminal-output {
            color: var(--color-text-secondary);
            padding-left: 1rem;
        }
        
        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--color-accent);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* ========== BUTTONS ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-fast);
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: var(--color-accent);
            color: var(--color-bg-deep);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-md);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
        }
        
        .btn-secondary:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: var(--color-accent-subtle);
        }
        
        /* ========== SECTIONS ========== */
        .section {
            padding: var(--space-xl) var(--space-md);
            position: relative;
            z-index: 1;
        }
        
        .section-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .section-header {
            margin-bottom: var(--space-lg);
        }
        
        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--color-accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: var(--space-sm);
        }
        
        .section-label::before {
            content: '//';
            opacity: 0.5;
        }
        
        .section-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        
        /* ========== ABOUT SECTION ========== */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-md);
        }
        
        .about-card {
            background: var(--color-bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: var(--space-md);
            transition: var(--transition-medium);
            position: relative;
            overflow: hidden;
        }
        
        .about-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--color-accent), var(--color-tertiary));
            opacity: 0;
            transition: var(--transition-medium);
        }
        
        .about-card:hover {
            border-color: var(--color-border-accent);
            transform: translateY(-5px);
        }
        
        .about-card:hover::before {
            opacity: 1;
        }
        
        .about-icon {
            width: 48px;
            height: 48px;
            background: var(--color-accent-subtle);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: var(--space-sm);
        }
        
        .about-card h3 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            margin-bottom: var(--space-xs);
        }
        
        .about-card p {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }
        
        /* ========== SKILLS SECTION ========== */
        .skills-wrapper {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: var(--space-lg);
            align-items: start;
        }
        
        .skills-intro p {
            color: var(--color-text-secondary);
            margin-bottom: var(--space-md);
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--space-sm);
        }
        
        .skill-item {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: var(--transition-fast);
            cursor: default;
        }
        
        .skill-item:hover {
            border-color: var(--color-accent);
            background: var(--color-accent-subtle);
            transform: translateY(-3px);
        }
        
        .skill-item span {
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        /* ========== PROJECTS SECTION ========== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: var(--space-md);
        }
        
        .project-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            overflow: hidden;
            transition: var(--transition-medium);
            position: relative;
        }
        
        .project-card:hover {
            border-color: var(--color-border-accent);
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        
        .project-header {
            padding: var(--space-md);
            display: flex;
            align-items: flex-start;
            gap: var(--space-sm);
        }
        
        .project-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--color-accent-subtle), rgba(168, 85, 247, 0.1));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            flex-shrink: 0;
        }
        
        .project-info h3 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }
        
        .project-type {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-accent);
        }
        
        .project-body {
            padding: 0 var(--space-md);
        }
        
        .project-body p {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            margin-bottom: var(--space-sm);
        }
        
        .project-features {
            list-style: none;
            margin-bottom: var(--space-sm);
        }
        
        .project-features li {
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            padding: 0.35rem 0;
            padding-left: 1.25rem;
            position: relative;
        }
        
        .project-features li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--color-accent);
        }
        
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0 var(--space-md) var(--space-md);
        }
        
        .project-tag {
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }
        
        .project-footer {
            padding: var(--space-sm) var(--space-md);
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: var(--space-sm);
        }
        
        .project-link {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition-fast);
        }
        
        .project-link:hover {
            color: var(--color-accent);
        }
        
        /* ========== EXPERIENCE SECTION ========== */
        .experience-timeline {
            position: relative;
            padding-left: var(--space-lg);
        }
        
        .experience-timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--color-accent), var(--color-tertiary), transparent);
        }
        
        .experience-item {
            position: relative;
            padding-bottom: var(--space-lg);
        }
        
        .experience-item::before {
            content: '';
            position: absolute;
            left: calc(-1 * var(--space-lg) + 3px);
            top: 6px;
            width: 10px;
            height: 10px;
            background: var(--color-accent);
            border-radius: 50%;
            box-shadow: var(--glow-sm);
        }
        
        .experience-header {
            display: flex;

            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-md);
        }

            background: linear-gradient(135deg, var(--color-bg-card), var(--color-bg-elevated));
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: var(--space-md);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            transition: var(--transition-medium);
        }
        
        .certificate-card:hover {
            border-color: var(--color-accent);
            transform: translateY(-3px);
        }

            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0078d4, #00bcf2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            margin-bottom: 0.25rem;

        .certificate-issuer {
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

            gap: var(--space-lg);

            text-decoration: none;
            padding: var(--space-sm);

            border: 1px solid var(--color-border);

            border-radius: 20px;
            padding: var(--space-md);

            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

            padding: 1rem;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            color: var(--color-text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: var(--transition-fast);
        }
        
        .form-group input:focus,

        }
        
        .form-submit {
            width: 100%;
            margin-top: var(--space-sm);

        .form-success {
            background: var(--color-accent-subtle);

            color: var(--color-accent);
            padding: var(--space-sm);
            border-radius: 12px;
            text-align: center;
            margin-bottom: var(--space-sm);
        }
        
        /* ========== FOOTER ========== */
        .footer {
            padding: var(--space-md);
            border-top: 1px solid var(--color-border);
            position: relative;
            z-index: 1;
        }
        
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-sm);

        .footer-link:hover {
            color: var(--color-accent);

        /* ========== RESPONSIVE ========== */

        }

        }

                console.log('Form:', formData);
                setSubmitted(true);
                setFormData({ name: '', email: '', message: '' });
                setTimeout(() => setSubmitted(false), 5000);
            };
            
            return (
                <section id="contact" className="section">
                    <div className="section-content">
                        <div className="section-header">
                            <p className="section-label">Get In Touch</p>
                            <h2 className="section-title">Let's Work Together</h2>
                        </div>

                                    I'm currently looking for new opportunities and collaborations. 
                                    Whether you have a project in mind or just want to connect, 
                                    I'd love to hear from you!
                                </p>
                                <div className="contact-links">
                                    <a href="mailto:jkhassan95@gmail.com" className="contact-link">
                                        <span className="contact-link-icon">📧</span>
                                        <span>jkhassan95@gmail.com</span>
                                    </a>
                                    <a href="https://www.linkedin.com/in/joseph-hassan-8679ba17/" target="_blank" className="contact-link">
                                        <span className="contact-link-icon">💼</span>
                                        <span>LinkedIn Profile</span>
                                    </a>
                                    <a href="https://github.com/JHCodeQuest" target="_blank" className="contact-link">
                                        <span className="contact-link-icon">🐱</span>
                                        <span>GitHub Profile</span>
                                    </a>
                                    <div className="contact-link" style={{cursor: 'default'}}>
                                        <span className="contact-link-icon">📍</span>
                                        <span>Broadway, Worcestershire, UK</span>
                                    </div>
                                </div>
                            </div>
                            <div className="contact-form">
                                {submitted && (
                                    <div className="form-success">✓ Message sent successfully!</div>
                                )}
                                <div className="form-group">
                                    <label>Your Name</label>
                                    <input type="text" name="name" value={formData.name} 
                                           onChange={handleChange} placeholder="John Doe" />
                                </div>
                                <div className="form-group">
                                    <label>Email Address</label>
                                    <input type="email" name="email" value={formData.email} 
                                           onChange={handleChange} placeholder="john@example.com" />
                                </div>
                                <div className="form-group">
                                    <label>Your Message</label>
                                    <textarea name="message" value={formData.message} 
                                              onChange={handleChange} placeholder="Tell me about your project..." />
                                </div>
                                <button className="btn btn-primary form-submit" onClick={handleSubmit}>
                                    Send Message →
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }
        
        // ========== FOOTER ==========
        function Footer() {
            return (
                <footer className="footer">
                    <div className="footer-content">
                        <p className="footer-text">
                            © {new Date().getFullYear()} Joseph Hassan. Built with <span>React</span>
